name: Publish Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # One native job per platform — produces a single py3-none-<platform> wheel.
  # pymcuc-pic is a .NET AOT binary with no Python ABI dependency, so no
  # per-Python-version builds are needed.
  build-wheels:
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-latest
            dotnet_rid: osx-x64
            wheel_platform_tag: macosx_13_0_x86_64
          - name: windows-x64
            os: windows-latest
          # Native arm64 build on a GitHub-hosted Windows on Arm runner.
          # NOTE: windows-11-arm runners require a public repo; for a private
          # repo, cross-compile from windows-latest with DOTNET_RID=win-arm64 +
          # WHEEL_PLATFORM_TAG=win_arm64 (needs the VS 2022 C++ ARM64 tools).
          - name: windows-arm64
            os: windows-11-arm

    steps:
      # Both repos checked out as siblings so the relative csproj path
      # ../../../../PyMCU/extensions/pymcu-sdk/csharp/PyMCU.Backend.SDK.csproj
      # resolves correctly from src/csharp/lib/ inside pymcu-pic/.
      - name: Checkout pymcu-pic
        uses: actions/checkout@v4
        with:
          path: pymcu-pic

      - name: Checkout pymcu monorepo (SDK dependency)
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          sparse-checkout: |
            extensions/pymcu-sdk/csharp
            global.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        working-directory: pymcu-pic
        env:
          DOTNET_RID: ${{ matrix.dotnet_rid }}
          WHEEL_PLATFORM_TAG: ${{ matrix.wheel_platform_tag }}
        run: uv build --wheel

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: pymcu-pic/dist/*.whl
          retention-days: 15

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish dist/*
